name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      guest_runtime:
        description: "Bundle the rish Linux guest runtime (librish_ffi.so + boot assets)"
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RISH_ANDROID_ABIS: arm64-v8a
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve and install Android SDK packages
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find "$SDK" -path '*cmdline-tools*/bin/sdkmanager' -print -quit)"
          echo "SDK root: $SDK"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          LIST="$("$SDKM" --list 2>/dev/null || true)"
          avail() { printf '%s\n' "$LIST" | awk -v p="$1" '$1 ~ "^"p {print $1}' | sort -uV; }
          echo "--- available platforms (tail) ---"; avail 'platforms;android-' | tail -8
          echo "--- available build-tools (tail) ---"; avail 'build-tools;' | tail -8
          echo "--- available ndk 27 ---"; avail 'ndk;27' || true
          PLAT="$(avail 'platforms;android-' | tail -1)"
          BT="$(avail 'build-tools;3' | tail -1)"
          NDK="$(avail 'ndk;27\.1\.12297006' | tail -1)"
          [ -n "$NDK" ] || NDK="$(avail 'ndk;27' | tail -1)"
          echo "chosen platform=$PLAT buildtools=$BT ndk=$NDK"
          for p in "$PLAT" "$BT" "$NDK" 'cmake;3.22.1'; do
            [ -n "$p" ] || continue
            "$SDKM" --install "$p" || echo "::warning::could not install $p"
          done
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          API="${PLAT#platforms;android-}"
          BTVER="${BT#build-tools;}"
          if [ "$API" != "37" ]; then
            sed -i "s/compileSdkVersion = 37/compileSdkVersion = $API/" apps/mobile/android/build.gradle
          fi
          if [ -n "$BTVER" ] && [ "$BTVER" != "37.0.0" ]; then
            sed -i "s/buildToolsVersion = \"37.0.0\"/buildToolsVersion = \"$BTVER\"/" apps/mobile/android/build.gradle
          fi
          echo "--- patched build.gradle ---"; sed -n '1,12p' apps/mobile/android/build.gradle
          if [ "$NDK" = "ndk;27.1.12297006" ]; then
            echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
            echo "RISH_GUEST_OK=1" >> "$GITHUB_ENV"
          else
            echo "RISH_GUEST_OK=0" >> "$GITHUB_ENV"
            echo "::warning::pinned NDK 27.1.12297006 unavailable; building a lite APK without the guest runtime"
          fi

      - name: Install Rust 1.94 and the Android target
        if: env.RISH_GUEST_OK == '1'
        run: |
          set -e
          rustup toolchain install 1.94 --profile minimal
          rustup target add --toolchain 1.94 aarch64-linux-android
          rustc +1.94 -vV

      - name: Install JavaScript dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Stage the rish guest runtime
        if: env.RISH_GUEST_OK == '1' && (github.event_name != 'workflow_dispatch' || inputs.guest_runtime)
        run: zsh scripts/prepare-rish-android.sh

      - name: Stage the shared Rust agent core (best effort)
        if: env.RISH_GUEST_OK == '1'
        continue-on-error: true
        run: zsh scripts/prepare-rish-agent-core-android.sh

      - name: Assemble the debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug \
            -PrishStandalone=true \
            -PreactNativeArchitectures=arm64-v8a \
            --stacktrace

      - name: Collect the APK
        if: always()
        run: |
          mkdir -p out
          find apps/mobile/android/app/build/outputs -name '*.apk' -exec cp {} out/ \; || true
          ls -l out
          for f in out/*.apk; do sha256sum "$f" > "$f.sha256"; done
          cat out/*.sha256 2>/dev/null || true
          echo "guest_runtime_staged=$([ -f apps/mobile/android/rish-ffi/rish_ffi.version ] && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rish-apk-arm64
          path: out/*
          if-no-files-found: warn
          retention-days: 30
