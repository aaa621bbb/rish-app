name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      guest_runtime:
        description: "Bundle the rish Linux guest runtime (librish_ffi.so + boot assets)"
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RISH_ANDROID_ABIS: arm64-v8a
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find "$SDK" -path '*cmdline-tools*/bin/sdkmanager' | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1" || \
            "$SDKM" --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          ls "$SDK/ndk" || true

      - name: Install Rust 1.94 and the Android target
        run: |
          set -e
          rustup toolchain install 1.94 --profile minimal
          rustup target add --toolchain 1.94 aarch64-linux-android
          rustc +1.94 -vV

      - name: Install JavaScript dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Stage the rish guest runtime
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.guest_runtime }}
        run: zsh scripts/prepare-rish-android.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Stage the shared Rust agent core (best effort)
        continue-on-error: true
        run: zsh scripts/prepare-rish-agent-core-android.sh

      - name: Assemble the debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug \
            -PrishStandalone=true \
            -PreactNativeArchitectures=arm64-v8a \
            --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          find apps/mobile/android/app/build/outputs -name '*.apk' -exec cp {} out/ \;
          ls -l out
          for f in out/*.apk; do sha256sum "$f" > "$f.sha256"; done
          cat out/*.sha256

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: rish-apk-arm64
          path: out/*
          if-no-files-found: error
          retention-days: 30
