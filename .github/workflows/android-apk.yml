name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      guest_runtime:
        description: "Bundle the rish Linux guest runtime (librish_ffi.so + boot assets)"
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RISH_ANDROID_ABIS: arm64-v8a
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh jq

      - name: Install Android SDK packages
        run: |
          set -u
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find "$SDK" -path '*cmdline-tools*/bin/sdkmanager' -print -quit)"
          echo "SDK root: $SDK"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          # The project pins compileSdk 37 / build-tools 37.0.0. The SDK now
          # names 37 as 37.0; install the stable line plus the 36 fallback.
          for p in "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-36" "build-tools;36.1.0" "ndk;27.1.12297006" "cmake;3.22.1"; do
            echo "::group::sdkmanager --install $p"
            "$SDKM" --install "$p" || echo "::warning::could not install $p"
            echo "::endgroup::"
          done
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "--- installed platforms ---"; ls "$SDK/platforms" || true
          for d in "$SDK"/platforms/*; do
            echo "$d: $(sed -n 's/^AndroidVersion\.\(ApiLevel\|MinorApiLevel\)=/\1=/p' "$d/source.properties" 2>/dev/null | tr '\n' ' ')"
          done
          # Gradle looks up platforms/android-<compileSdk>; alias a 37.0 install
          # to the plain 37 path when the SDK used the minor-version layout.
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -d "$SDK/platforms/android-37" ]; then
            ln -s "$SDK/platforms/android-37.0" "$SDK/platforms/android-37" || true
          fi
          echo "--- platforms after aliasing ---"; ls "$SDK/platforms" || true
          if [ -d "$SDK/ndk/27.1.12297006" ]; then
            echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
            echo "RISH_GUEST_OK=1" >> "$GITHUB_ENV"
          else
            echo "RISH_GUEST_OK=0" >> "$GITHUB_ENV"
            echo "::warning::pinned NDK 27.1.12297006 unavailable; building a lite APK without the guest runtime"
          fi

      - name: Install Rust 1.94 and the Android target
        if: env.RISH_GUEST_OK == '1'
        run: |
          set -e
          rustup toolchain install 1.94 --profile minimal
          rustup target add --toolchain 1.94 aarch64-linux-android
          rustc +1.94 -vV

      - name: Install JavaScript dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Stage the rish guest runtime
        if: env.RISH_GUEST_OK == '1' && (github.event_name != 'workflow_dispatch' || inputs.guest_runtime)
        run: zsh scripts/prepare-rish-android.sh

      - name: Stage the shared Rust agent core (best effort)
        if: env.RISH_GUEST_OK == '1'
        continue-on-error: true
        run: zsh scripts/prepare-rish-agent-core-android.sh

      - name: Assemble the debug APK
        working-directory: apps/mobile/android
        run: |
          set -u
          chmod +x gradlew
          ARGS=":app:assembleDebug -PrishStandalone=true -PreactNativeArchitectures=arm64-v8a --stacktrace --no-daemon"
          if ./gradlew $ARGS; then
            echo "BUILD_SDK=37" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::warning::compileSdk 37 build failed; retrying with compileSdk 36"
          sed -i 's/compileSdkVersion = 37/compileSdkVersion = 36/; s/buildToolsVersion = "37.0.0"/buildToolsVersion = "36.1.0"/' build.gradle
          ./gradlew $ARGS
          echo "BUILD_SDK=36" >> "$GITHUB_ENV"

      - name: Collect the APK
        if: always()
        run: |
          mkdir -p out
          find apps/mobile/android/app/build/outputs -name '*.apk' -exec cp {} out/ \; || true
          ls -l out || true
          ( cd out && for f in *.apk; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done ) || true
          cat out/*.sha256 2>/dev/null || true
          {
            echo "guest_runtime_staged=$([ -f apps/mobile/android/rish-ffi/rish_ffi.version ] && echo yes || echo no)"
            echo "agent_core_staged=$([ -f apps/mobile/android/rish-agent-core/rish_agent_core.version ] && echo yes || echo no)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rish-apk-arm64
          path: out/
          if-no-files-found: warn
          retention-days: 30
